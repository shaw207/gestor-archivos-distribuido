# Alumno: Chengxun Wu
apiVersion: apps/v1
kind: Deployment
metadata:
  name: server-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: server
  template:
    metadata:
      labels:
        app: server
    spec:
      containers:
        - name: server-container
          image: shaw207/serverfilemanager:v4
          imagePullPolicy: Always


          command: ["/serverFileManager"]
          args:
            - "$(BROKER_SERVICE_SERVICE_HOST)"
            - "32002"
            - "$(MY_NODE_IP)"
            - "32001"

          env:
            - name: MY_NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP

          ports:
            - containerPort: 32001

          volumeMounts:
            - name: nfs-volume
              mountPath: /FileManagerDir

      volumes:
        - name: nfs-volume
          nfs:
            server: nfs.example.invalid
            path: /FileManagerDir

