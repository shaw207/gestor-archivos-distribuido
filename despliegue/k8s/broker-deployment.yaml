apiVersion: apps/v1
kind: Deployment
metadata:
  name: broker-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: broker
  template:
    metadata:
      labels:
        app: broker
    spec:
      containers:
      - name: broker-container
        image: shaw207/brokerfilemanager:v4
        imagePullPolicy: Always
        ports:
        - containerPort: 32002

